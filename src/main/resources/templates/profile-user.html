<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="card shadow-sm bg-white p-4">
        <h2 class="mb-4">Profile</h2>

        <p><strong>Имя:</strong> <span th:text="${user.name}"></span></p>
        <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
        <p><strong>Возраст:</strong> <span th:text="${user.age}"></span></p>
        <p><strong>Пароль:</strong> <span th:text="${user.password}"></span></p>

        <p><strong>Роли:</strong></p>
        <ul class="list-group mb-3">
            <li class="list-group-item" th:each="role : ${user.roles}" th:text="${role.role}"></li>
        </ul>

        <a href="/logout" class="btn btn-dark">Logout</a>
    </div>
</div>

</body>
</html>
