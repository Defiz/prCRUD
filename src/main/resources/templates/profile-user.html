<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
</head>
<body>
<p>Имя: <span th:text="${user.name}"></span></p>
<p>Email: <span th:text="${user.email}"></span></p>
<p>Возраст: <span th:text="${user.age}"></span></p>
<p>Пароль: <span th:text="${user.password}"></span></p>
<p>Роли:</p>
<ul>
    <li th:each="role : ${user.roles}" th:text="${role.role}"></li>
</ul>
<p></p>
<a href="/logout">Logout</a>
</body>
</html>
