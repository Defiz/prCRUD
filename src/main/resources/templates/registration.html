<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="card shadow-sm bg-white p-4">
        <h2 class="mb-4">Registration</h2>

        <form th:method="POST" th:action="@{/registration}" th:object="${user}">
            <div class="mb-3">
                <label class="form-label">Name:</label>
                <input type="text" th:field="*{name}" class="form-control" required/>
                <div th:if="@{#fields.hashErrors('name')}" th:errors="*{name}" class="text-danger mt-1"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Age:</label>
                <input type="number" th:field="*{age}" class="form-control" required/>
                <div th:if="@{#fields.hashErrors('age')}" th:errors="*{age}" class="text-danger mt-1"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" th:field="*{email}" class="form-control" required/>
                <div th:if="@{#fields.hashErrors('email')}" th:errors="*{email}" class="text-danger mt-1"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password:</label>
                <input type="password" th:field="*{password}" class="form-control" required/>
            </div>

            <button type="submit" class="btn btn-success">Sign up</button>
        </form>
    </div>
</div>

</body>
</html>
