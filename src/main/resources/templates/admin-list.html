<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light">

<div class="container my-5">
    <h2 class="mb-4">Admin panel</h2>

    <!-- Кнопка добавления нового пользователя -->
    <button id="addUserBtn" class="btn btn-success mb-3">Add New User</button>

    <!-- Таблица пользователей -->
    <div class="table-responsive">
        <table class="table table-striped table-bordered bg-white shadow-sm" id="usersTable">
            <thead class="table-light">
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Update</th>
                <th>Remove</th>
            </tr>
            </thead>
            <tbody>
            <!-- JS вставляет строки -->
            </tbody>
        </table>
    </div>

    <a href="/logout" class="btn btn-dark">Logout</a>
</div>

<!-- Модальное окно редактирования -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editUserForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editUserId">

                    <div class="mb-3">
                        <label for="editUserName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="editUserName" required>
                    </div>

                    <div class="mb-3">
                        <label for="editUserAge" class="form-label">Age</label>
                        <input type="number" class="form-control" id="editUserAge" required>
                    </div>

                    <div class="mb-3">
                        <label for="editUserEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="editUserEmail" required>
                    </div>

                    <div class="mb-3">
                        <label for="editUserPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="editUserPassword" placeholder="Leave blank to keep current">
                    </div>

                    <!-- Роли через checkbox -->
                    <div class="mb-3">
                        <label class="form-label">Roles</label>
                        <div class="form-check">
                            <input class="form-check-input roleCheckbox" type="checkbox" id="roleUser" value="ROLE_USER">
                            <label class="form-check-label" for="roleUser">User</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input roleCheckbox" type="checkbox" id="roleAdmin" value="ROLE_ADMIN">
                            <label class="form-check-label" for="roleAdmin">Admin</label>
                        </div>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Модальное окно создания -->
<div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="addUserForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="addUserModalLabel">Add New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <div class="mb-3">
                        <label for="addUserName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="addUserName" required>
                    </div>

                    <div class="mb-3">
                        <label for="addUserAge" class="form-label">Age</label>
                        <input type="number" class="form-control" id="addUserAge" required>
                    </div>

                    <div class="mb-3">
                        <label for="addUserEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="addUserEmail" required>
                    </div>

                    <div class="mb-3">
                        <label for="addUserPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="addUserPassword" required>
                    </div>

                    <!-- Роли через checkbox -->
                    <div class="mb-3">
                        <label class="form-label">Roles</label>
                        <div class="form-check">
                            <input class="form-check-input addRoleCheckbox" type="checkbox" id="addRoleUser" value="ROLE_USER">
                            <label class="form-check-label" for="addRoleUser">User</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input addRoleCheckbox" type="checkbox" id="addRoleAdmin" value="ROLE_ADMIN">
                            <label class="form-check-label" for="addRoleAdmin">Admin</label>
                        </div>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-success">Create User</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {

        let editUserModal = new bootstrap.Modal(document.getElementById('editUserModal'));
        let addUserModal = new bootstrap.Modal(document.getElementById('addUserModal'));

        function loadUsers() {
            $.ajax({
                url: '/api/admin/users',
                type: 'GET',
                dataType: 'json',
                success: function(users) {
                    let tbody = $('#usersTable tbody');
                    tbody.empty();
                    users.forEach(function(u) {
                        let row = `<tr>
                        <td>${u.id}</td>
                        <td>${u.name}</td>
                        <td>${u.age}</td>
                        <td>${u.email}</td>
                        <td>
                            <button class="btn btn-success btn-sm editBtn" data-id="${u.id}">Edit</button>
                        </td>
                        <td>
                            <button class="btn btn-danger btn-sm deleteBtn" data-id="${u.id}">Delete</button>
                        </td>
                    </tr>`;
                        tbody.append(row);
                    });
                },
            });
        }

        loadUsers();

        $('#usersTable').on('click', '.editBtn', function () {
            let userId = $(this).data('id');
            $.ajax({
                url: `/api/admin/users/${userId}`,
                type: 'GET',
                dataType: 'json',
                success: function(user) {
                    $('#editUserId').val(user.id);
                    $('#editUserName').val(user.name);
                    $('#editUserAge').val(user.age);
                    $('#editUserEmail').val(user.email);
                    $('#editUserPassword').val('');

                    $('.roleCheckbox').prop('checked', false);
                    if (user.roles.includes('ROLE_USER')) $('#roleUser').prop('checked', true);
                    if (user.roles.includes('ROLE_ADMIN')) $('#roleAdmin').prop('checked', true);

                    editUserModal.show();
                },
                error: function(err) { alert('Ошибка при загрузке пользователя'); }
            });
        });

        $('#editUserForm').submit(function(e) {
            e.preventDefault();
            let id = $('#editUserId').val();
            let roles = [];
            $('.roleCheckbox:checked').each(function(){ roles.push($(this).val()); });
            let password = $('#editUserPassword').val();

            let userDto = {
                id: id,
                name: $('#editUserName').val(),
                age: parseInt($('#editUserAge').val()),
                email: $('#editUserEmail').val(),
                roles: roles
            };

            $.ajax({
                url: `/api/admin/users/${id}`,
                type: 'PATCH',
                contentType: 'application/json',
                data: JSON.stringify(userDto),
                success: function() { editUserModal.hide(); loadUsers(); alert('Пользователь обновлён!'); },
                error: function(err) { alert('Ошибка при обновлении'); console.error(err); }
            });
        });

        $('#addUserBtn').click(function(){ addUserModal.show(); });

        $('#addUserForm').submit(function(e) {
            e.preventDefault();
            let roles = [];
            $('.addRoleCheckbox:checked').each(function(){ roles.push($(this).val()); });

            let userDto = {
                name: $('#addUserName').val(),
                age: parseInt($('#addUserAge').val()),
                email: $('#addUserEmail').val(),
                password: $('#addUserPassword').val(),
                roles: roles
            };

            $.ajax({
                url: `/api/admin/users`,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(userDto),
                success: function() { addUserModal.hide(); loadUsers(); alert('Пользователь создан!'); },
                error: function(err) { alert('Ошибка при создании'); console.error(err); }
            });
        });


        $('#usersTable').on('click', '.deleteBtn', function () {
            let userId = $(this).data('id');
            if (!confirm('Удалить пользователя?')) return;
            $.ajax({
                url: `/api/admin/users/${userId}`,
                type: 'DELETE',
                success: function() { loadUsers(); alert('Пользователь удалён'); },
                error: function(err) { alert('Ошибка при удалении'); console.error(err); }
            });
        });

    });
</script>

</body>
</html>
