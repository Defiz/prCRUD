<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="card shadow-sm bg-white p-4">
        <h2 class="mb-4">Edit User</h2>

        <form th:action="@{/admin/update}" th:object="${user}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" name="_method" value="patch"/>

            <div class="mb-3">
                <label class="form-label">Name:</label>
                <input type="text" th:field="*{name}" class="form-control" required/>
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger mt-1"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Age:</label>
                <input type="number" th:field="*{age}" class="form-control" required/>
                <div th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="text-danger mt-1"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" th:field="*{email}" class="form-control" required/>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger mt-1"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password:</label>
                <input type="password" th:field="*{password}" class="form-control" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Role:</label><br/>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox"
                           th:field="*{roles}"
                           th:value="ROLE_ADMIN" id="roleAdmin"/>
                    <label class="form-check-label" for="roleAdmin">ADMIN</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox"
                           th:field="*{roles}"
                           th:value="ROLE_USER" id="roleUser"/>
                    <label class="form-check-label" for="roleUser">USER</label>
                </div>
            </div>

            <button type="submit" class="btn btn-success">Save changes</button>
            <a th:href="@{/admin}" class="btn btn-secondary ms-2">Back to Users List</a>
        </form>

        <div class="mt-3">
            <a href="/logout" class="btn btn-dark">Logout</a>
        </div>
    </div>
</div>

</body>
</html>
