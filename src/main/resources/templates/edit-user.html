<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
</head>
<body>

<h2>Edit User</h2>

<form th:action="@{/users/update}" th:object="${user}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <input type="hidden" name="_method" value="patch"/>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br/>

    <label>Age:</label>
    <input type="number" th:field="*{age}" required/><br/>

    <label>Email:</label>
    <input type="email" th:field="*{email}" required/><br/>

    <button type="submit">Update</button>
</form>

<br/>
<a th:href="@{/users}">Back to Users List</a>

</body>
</html>
