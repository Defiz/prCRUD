<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add User</title>
</head>
<body>

<h2>Add New User</h2>

<form th:action="@{/users/save}" th:object="${user}" method="POST">
    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br/>

    <label>Age:</label>
    <input type="number" th:field="*{age}" required/><br/>

    <label>Email:</label>
    <input type="email" th:field="*{email}" required/><br/>

    <button type="submit">Add</button>
</form>

<br/>
<a th:href="@{/users}">Back to Users List</a>

</body>
</html>
